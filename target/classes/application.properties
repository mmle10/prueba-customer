# Quarkus configuration
quarkus.http.port=8080
quarkus.http.test-port=8080

# Database configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# External REST Client configuration
restcountries-api/mp-rest/url=https://restcountries.com/v3.1
restcountries-api/mp-rest/scope=javax.enterprise.context.ApplicationScoped

# REST Client logging for debugging
org.eclipse.microprofile.rest.client.Logger=DEBUG
org.jboss.resteasy.reactive.client.logging=DEBUG

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true

# OpenAPI configuration
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Customer Management API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API for managing customers
